services:
  db:
    image: postgres:16-alpine
    container_name: trade247-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trade247
      POSTGRES_PASSWORD: trade247
      POSTGRES_DB: trade247
    ports:
      - "5432:5432"
    volumes:
      - trade247_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade247"]
      interval: 5s
      timeout: 5s
      retries: 5

  # All-in-one app: builds the image, applies the schema, seeds demo data on
  # first run, then serves on http://localhost:3000. One command: `docker compose up`.
  app:
    build: .
    container_name: trade247-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides DATABASE_URL from .env so the app reaches the db container.
      DATABASE_URL: postgresql://trade247:trade247@db:5432/trade247?schema=public
      NEXTAUTH_URL: http://localhost:3000
      SEED_ON_START: "true"
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  trade247_pgdata:
